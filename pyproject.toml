[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dolly"
version = "0.1.0.dev0"
description = "Direct KERI credential reporting and historical evidence inspection"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["keri @ git+https://github.com/kentbull/keripy.git@2b19fa875d8c803c613087102db51b9e07124588"]

[project.scripts]
dolly = "dolly.cli:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "ruff==0.15.4",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@f0634584da5a5bd10ddd9208bfee09fa0f49c25f",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3855f05a28e3738aec05569020bfea2050695925",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dolly.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
