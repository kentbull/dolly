[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dolly"
version = "0.1.0.dev0"
description = "Direct KERI credential reporting and historical evidence inspection"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["keri @ git+https://github.com/kentbull/keripy.git@fefc2efb82391ce254217ba89f809c9bbef18c4e"]

[project.scripts]
dolly = "dolly.cli:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "ruff==0.15.4",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@656f73f766af7ab818b5409b5ca5c987eec39df0",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3c7bdacd43aa223221d3d86d154e485cc1c95358",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dolly.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
