[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dolly"
version = "0.1.0.dev0"
description = "Direct KERI credential reporting and historical evidence inspection"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["keri @ git+https://github.com/kentbull/keripy.git@c15cdc02e9d8fee54b3271b612e2bf20b487fe58"]

[project.scripts]
dolly = "dolly.cli:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "ruff==0.15.4",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@f12447f3eae46fe4a98d2140c783b06d0a7f9ff0",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@1bdfe9dcc0a09ff024479b00adb13001487acca0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dolly.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
