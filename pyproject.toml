[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dolly"
version = "0.1.0.dev0"
description = "Direct KERI credential reporting and historical evidence inspection"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["keri @ git+https://github.com/kentbull/keripy.git@d956ae17a0eb177b536aac3efa09ed5bd34ace11"]

[project.scripts]
dolly = "dolly.cli:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "ruff==0.15.4",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@61b2cc54731b26b7442a74cb5b8bfc37fbd61a08",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@ac69c21b4ab1f91a633859a3ea5bdda1a7655701",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dolly.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
