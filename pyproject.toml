[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dolly"
version = "0.1.0.dev0"
description = "Direct KERI credential reporting and historical evidence inspection"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["keri @ git+https://github.com/kentbull/keripy.git@f08d23d2327eff99b812754f76fc10d35e427a1c"]

[project.scripts]
dolly = "dolly.cli:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "ruff==0.15.4",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@9de1cfa3b5ad858603f0e5290c9def798ecd2b8d",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@ae7af7bb8683dba3e1357df6969568589ecf2d3c",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dolly.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
